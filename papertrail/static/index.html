<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperTrail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #17140f; --surface: #211c16; --raised: #2b251d; --line: #3d3428;
    --text: #efe3cc; --muted: #a8987f;
    --orange: #e8833a; --mustard: #e6b54a; --teal: #5fa8a0; --rust: #c8553d; --chip: #3a2a1a;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ink); color: var(--text); font-family: var(--sans); display: flex; flex-direction: column;
         -webkit-font-smoothing: antialiased; }
  a { color: var(--mustard); } a:hover { color: #f2cf7a; }
  ::selection { background: var(--orange); color: var(--ink); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
           padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .logo { width: 32px; height: 32px; border-radius: 6px; background: var(--orange); display: grid; place-items: center; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--teal); } .dot.down { background: var(--rust); }

  #log { flex: 1; overflow-y: auto; }
  .col { width: 100%; max-width: 780px; margin: 0 auto; padding: 0 20px; }
  /* Bottom padding leaves room for the floating search bar, so the last line never hides under it. */
  #messages { display: flex; flex-direction: column; gap: 32px; padding: 32px 0 170px; }

  .empty { text-align: center; padding: 12vh 0 0; }
  .empty h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  .empty p { color: var(--muted); margin: 0 0 28px; }
  .examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; text-align: left; }
  .examples button { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--line);
                     border-radius: 10px; padding: 14px; cursor: pointer; text-align: left; line-height: 1.45; }
  .examples button:hover { border-color: var(--orange); }

  .q { align-self: flex-end; max-width: 80%; background: var(--raised); border: 1px solid var(--line);
       border-radius: 14px 14px 4px 14px; padding: 12px 16px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a { display: flex; flex-direction: column; gap: 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
  .meta .who { color: var(--text); font-weight: 600; }
  .meta .who::before { content: '●'; color: var(--orange); margin-right: 6px; }

  .steps { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
  .step { display: flex; align-items: center; gap: 10px; animation: rise .3s ease both; }
  .step .ic { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
  .step.active .ic::before { content: ''; width: 12px; height: 12px; border-radius: 50%;
                             border: 2px solid var(--line); border-top-color: var(--orange); animation: spin .8s linear infinite; }
  .step.done { color: var(--muted); }
  .step.done .ic::before { content: '✓'; color: var(--teal); font-size: 13px; font-weight: 700; }

  .body { font-size: 16px; line-height: 1.75; overflow-wrap: anywhere; }
  .body p { margin: 0 0 14px; } .body ul { margin: 0 0 14px; padding-left: 22px; } .body li { margin-bottom: 4px; }
  .body code { font-family: var(--mono); font-size: .9em; background: var(--raised); padding: 1px 5px; border-radius: 4px; }
  .body.err { color: var(--rust); }
  .body.streaming > :last-child::after { content: ''; display: inline-block; width: 8px; height: 1.05em; margin-left: 3px;
                                         vertical-align: -2px; background: var(--orange); animation: blink 1s steps(1) infinite; }
  .cite { font-family: var(--mono); font-size: 12px; font-weight: 600; background: var(--chip); color: var(--orange);
          padding: 1px 6px; border-radius: 4px; text-decoration: none; margin: 0 1px; }
  .cite:hover { background: var(--orange); color: var(--ink); }

  .sources-label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .src { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line);
         border-radius: 10px; text-decoration: none; color: var(--text); transition: border-color .15s; animation: rise .35s ease both; }
  .src:hover, .src.flash { border-color: var(--orange); color: var(--text); }
  .src .id { font-family: var(--mono); font-size: 11px; color: var(--mustard); }
  .src .t { font-size: 13.5px; font-weight: 500; line-height: 1.4; }
  .src .c { font-size: 12px; color: var(--muted); }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

  /* The search bar floats over the chat: no band behind it, just a short fade so text slides under softly. */
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 40px 0 16px; pointer-events: none;
           background: linear-gradient(to top, rgba(23, 20, 15, .92) 30%, rgba(23, 20, 15, 0)); }
  footer .col { pointer-events: auto; }
  form { display: flex; align-items: flex-end; gap: 10px; background: rgba(33, 28, 22, .88); border: 1px solid var(--line);
         border-radius: 22px; padding: 8px 8px 8px 20px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
         box-shadow: 0 12px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .35); transition: border-color .15s, box-shadow .15s; }
  form:focus-within { border-color: var(--orange); box-shadow: 0 12px 40px rgba(0, 0, 0, .55), 0 0 0 3px rgba(232, 131, 58, .18); }
  textarea { flex: 1; resize: none; background: transparent; border: 0; outline: none; color: var(--text);
             font: inherit; font-size: 15px; line-height: 1.5; padding: 10px 0; max-height: 200px; }
  textarea::placeholder { color: var(--muted); }
  #send { width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; background: var(--orange); color: var(--ink);
          display: grid; place-items: center; cursor: pointer; }
  #send:disabled { opacity: .4; cursor: default; }
  #send:focus-visible, .examples button:focus-visible, .src:focus-visible { outline: 2px solid var(--mustard); outline-offset: 2px; }
  .hint { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
  .fb { display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--muted); }
  .fb .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .fb button { font: inherit; font-size: 13px; background: var(--surface); color: var(--muted); border: 1px solid var(--line);
               border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  .fb button:hover { border-color: var(--orange); color: var(--text); }
  .fb button[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: var(--ink); }
  .fb .stars button { padding: 5px 7px; }
  .fb textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; width: 100%; }
  .fb .details { display: flex; flex-direction: column; gap: 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17140f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg></div>
    PaperTrail
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
</header>

<div id="log">
  <div class="col">
    <div id="messages">
      <div class="empty" id="empty">
        <h1>Ask the archive.</h1>
        <p>Answers built from real arXiv computer science papers, every claim cited.</p>
        <div class="examples">
          <button type="button">How do people defend large language models against prompt injection?</button>
          <button type="button">How do diffusion models compare to GANs?</button>
          <button type="button">Graph neural networks for molecules</button>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="col">
    <form id="form">
      <label for="q" class="sr">Ask a question</label>
      <textarea id="q" rows="1" placeholder="Ask about any computer science research…" autofocus></textarea>
      <button id="send" type="submit" aria-label="Send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <p class="hint">Answers come only from arXiv abstracts. Check the sources.</p>
  </div>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const log = $('#log'), messages = $('#messages'), form = $('#form'), q = $('#q'), send = $('#send');
let busy = false, turn = 0, paperCount = null;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

// Turn the LLM's markdown-ish text into HTML, replacing [arXiv:ID] with numbered chips.
function render(text, papers, t) {
  const index = new Map(papers.map((p, i) => [String(p.id), i + 1]));
  const h = esc(text)
    .replace(/\[([^\]]*arXiv:[^\]]*)\]/g, (_, inner) =>
      inner.split(/[,;]/).map((part) => {
        const id = part.replace(/.*arXiv:\s*/, '').trim().replace(/v\d+$/, '');
        const n = index.get(id);
        return n ? `<a class="cite" href="#s${t}-${n}" data-src="s${t}-${n}" title="arXiv:${id}">${n}</a>`
                 : `<span class="cite">arXiv:${id}</span>`;
      }).join(''))
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  return h.split(/\n{2,}/).filter((b) => b.trim()).map((block) => {
    const lines = block.split('\n');
    if (lines.every((l) => /^\s*[-*]\s+/.test(l) || !l.trim()))
      return '<ul>' + lines.filter((l) => l.trim()).map((l) => `<li>${l.replace(/^\s*[-*]\s+/, '')}</li>`).join('') + '</ul>';
    return `<p>${block.replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

function sourceCards(papers, t) {
  const wrap = el('div', 'a');
  wrap.append(el('div', 'sources-label', 'Sources'));
  const grid = el('div', 'sources');
  papers.forEach((p, i) => {
    const a = el('a', 'src', `
      <span class="id">[${i + 1}] arXiv:${esc(p.id)}</span>
      <span class="t">${esc(p.title)}</span>
      <span class="c">${esc((p.categories || '').split(' ')[0])}${p.update_date ? ' · ' + esc(String(p.update_date).slice(0, 4)) : ''}</span>`);
    a.id = `s${t}-${i + 1}`;
    a.href = p.url || `https://arxiv.org/abs/${p.id}`;
    a.target = '_blank'; a.rel = 'noopener';
    a.style.animationDelay = `${i * 60}ms`;  // cards arrive one after another
    grid.append(a);
  });
  wrap.append(grid);
  return wrap;
}

// Rating controls, added once an answer is complete. The whole current state is sent on every
// change, so rating again simply replaces the earlier rating.
function feedbackControls(answer, answerId) {
  const state = { answer_id: answerId, vote: null, rating: null, reasons: [], comment: '' };
  const box = el('div', 'fb');
  const note = el('span', '', '');
  note.setAttribute('role', 'status');
  const button = (label, title) => {
    const b = el('button', '', esc(label));
    b.type = 'button'; b.title = title; b.setAttribute('aria-label', title); b.setAttribute('aria-pressed', 'false');
    return b;
  };
  const press = (b, on) => b.setAttribute('aria-pressed', String(on));
  async function submit() {
    if (!state.vote && !state.rating && !state.comment) return;
    try {
      const res = await fetch('/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) });
      const data = await res.json().catch(() => ({}));
      note.textContent = res.ok ? 'Thanks, your feedback was saved.' : (typeof data.detail === 'string' ? data.detail : 'Could not save feedback.');
    } catch { note.textContent = 'Could not save feedback.'; }
  }

  const top = el('div', 'row', '<span>Was this helpful?</span>');
  const up = button('👍', 'Helpful'), down = button('👎', 'Not helpful');
  const details = el('div', 'details'); details.hidden = true;
  for (const [b, v] of [[up, 'up'], [down, 'down']]) b.addEventListener('click', () => {
    state.vote = v; press(up, v === 'up'); press(down, v === 'down'); details.hidden = v !== 'down'; submit(); follow();
  });
  const stars = el('span', 'row stars', '<span>Rating</span>');
  const starButtons = [1, 2, 3, 4, 5].map((n) => {
    const b = button('☆', `${n} out of 5`);
    b.addEventListener('click', () => {
      state.rating = n;
      starButtons.forEach((s, i) => { s.textContent = i < n ? '★' : '☆'; press(s, false); });
      press(b, true); if (n <= 2) details.hidden = false; submit();
    });
    stars.append(b); return b;
  });
  top.append(up, down, stars);

  const reasons = el('div', 'row', '<span>What was wrong?</span>');
  for (const [key, label] of [['wrong', 'Wrong'], ['off_topic', "Doesn't answer"], ['bad_citation', 'Bad citation'],
                              ['incomplete', 'Missing something'], ['irrelevant_sources', 'Irrelevant sources']]) {
    const b = button(label, label);
    b.addEventListener('click', () => {
      const on = !state.reasons.includes(key);
      state.reasons = on ? [...state.reasons, key] : state.reasons.filter((r) => r !== key);
      press(b, on); submit();
    });
    reasons.append(b);
  }
  const comment = document.createElement('textarea');
  comment.rows = 2; comment.maxLength = 500; comment.placeholder = 'Optional details'; comment.setAttribute('aria-label', 'Optional details');
  const sendComment = button('Send comment', 'Send comment');
  sendComment.addEventListener('click', () => { state.comment = comment.value.trim(); submit(); });
  const commentRow = el('div', 'row'); commentRow.append(sendComment);
  details.append(reasons, comment, commentRow);
  box.append(top, details, note);
  answer.append(box);
  follow();
}

// Keep the newest text in view while an answer is written. Only the reader scrolling up
// (wheel, touch, keys) stops this; scrolling back to the bottom turns it on again.
let stick = true;
const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 120;
const follow = () => { if (stick) log.scrollTop = log.scrollHeight; };
log.addEventListener('wheel', (e) => { if (e.deltaY < 0) stick = false; }, { passive: true });
log.addEventListener('touchmove', () => { stick = nearBottom(); }, { passive: true });
document.addEventListener('keydown', (e) => {
  if (['PageUp', 'ArrowUp', 'Home'].includes(e.key) && e.target !== q) stick = false;
});
log.addEventListener('scroll', () => { if (nearBottom()) stick = true; });
// Content that grows without a frame tick (cards sliding in, fonts loading) still gets followed.
new ResizeObserver(follow).observe(messages);

// A progress list: each stage gets a spinner, then a tick when it is done.
function steps(container) {
  const list = el('div', 'steps');
  container.append(list);
  let current = null;
  return {
    next(label) {
      if (current) current.className = 'step done';
      current = el('div', 'step active', `<span class="ic"></span><span>${esc(label)}</span>`);
      list.append(current);
      follow();
    },
    finish() { list.remove(); },
  };
}

// Types text out at a steady pace while it streams in; catches up faster if it falls far behind.
function typewriter(body, papers, t) {
  let target = '', shown = 0, ended = false, frame = null, resolve;
  const finished = new Promise((r) => (resolve = r));
  const tick = () => {
    const behind = target.length - shown;
    shown += Math.min(behind, Math.max(2, Math.ceil(behind / 40)));
    // Hide a citation that has only half arrived, e.g. "[arXiv:25", until its "]" comes.
    const visible = target.slice(0, shown).replace(/\[[^\]]*$/, '');
    body.innerHTML = render(visible, papers, t) || '<p></p>';
    follow();
    if (shown < target.length) frame = requestAnimationFrame(tick);
    else { frame = null; if (ended) { body.classList.remove('streaming'); resolve(); } }
  };
  return {
    push(text) { target += text; if (!frame) frame = requestAnimationFrame(tick); },
    end() { ended = true; if (!frame) { body.classList.remove('streaming'); resolve(); } },
    finished,
  };
}

async function* readEvents(res) {
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const lineText = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (lineText) yield JSON.parse(lineText);
    }
  }
  if (buf.trim()) yield JSON.parse(buf);
}

async function ask(question) {
  if (busy || !question.trim()) return;
  busy = true; send.disabled = true; stick = true;
  $('#empty')?.remove();
  const t = ++turn;

  messages.append(el('div', 'q', esc(question)));
  const a = el('div', 'a');
  const meta = el('div', 'meta', '<span class="who">PaperTrail</span>');
  a.append(meta);
  messages.append(a);
  const progress = steps(a);
  progress.next(paperCount ? `Searching ${paperCount.toLocaleString()} papers` : 'Searching papers');

  let body = null, writer = null, papers = [];
  const startBody = () => {
    progress.finish();
    body = el('div', 'body streaming');
    a.append(body);
    writer = typewriter(body, papers, t);
  };
  const fail = (msg) => {
    progress.finish();
    if (!body) { body = el('div', 'body'); a.append(body); }
    body.classList.remove('streaming'); body.classList.add('err');
    body.textContent = msg;
  };

  try {
    const res = await fetch('/ask/stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(typeof data.detail === 'string' ? data.detail : `Request failed (${res.status})`);
    }
    for await (const ev of readEvents(res)) {
      if (ev.type === 'papers') {
        papers = ev.papers || [];
        if (!papers.length) { progress.finish(); startBody(); continue; }
        progress.next(`Found ${papers.length} papers · reading the abstracts`);
        a.append(sourceCards(papers, t));
      } else if (ev.type === 'delta') {
        if (!body) startBody();
        writer.push(ev.text);
      } else if (ev.type === 'done') {
        if (!body) startBody();
        writer.end();
        await writer.finished;
        const secs = ev.timing_ms?.total != null ? (ev.timing_ms.total / 1000).toFixed(1) + ' s' : '';
        meta.insertAdjacentHTML('beforeend',
          `<span>·</span><span>${papers.length} sources${secs ? ' · ' + secs : ''}${ev.cached ? ' · cached' : ''}</span>`);
        if (ev.answer_id) feedbackControls(a, ev.answer_id);
      } else if (ev.type === 'error') {
        if (writer) { writer.end(); await writer.finished; }
        if (body && body.textContent.trim()) body.insertAdjacentHTML('beforeend', `<p class="err" style="color:var(--rust)">${esc(ev.detail)}</p>`);
        else fail(ev.detail);
      }
    }
  } catch (e) {
    fail(e.message === 'Failed to fetch' ? 'Could not reach the PaperTrail server.' : e.message);
  } finally {
    busy = false; send.disabled = !q.value.trim();
    follow();
  }
}

// Clicking a citation chip highlights its source card.
messages.addEventListener('click', (e) => {
  const chip = e.target.closest('.cite[data-src]');
  if (!chip) return;
  e.preventDefault();
  stick = false;  // the reader chose to look up at a source; don't pull them back down
  const card = document.getElementById(chip.dataset.src);
  card?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card?.classList.add('flash');
  setTimeout(() => card?.classList.remove('flash'), 1200);
});

document.querySelectorAll('.examples button').forEach((b) => b.addEventListener('click', () => ask(b.textContent)));

q.addEventListener('input', () => {
  q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px';
  send.disabled = busy || !q.value.trim();
});
q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = q.value;
  q.value = ''; q.style.height = 'auto';
  ask(text);
});

fetch('/health').then((r) => r.json()).then((h) => {
  paperCount = Number(h.papers);
  $('#dot').className = 'dot ok';
  $('#status').textContent = `${paperCount.toLocaleString()} papers · ${h.model}`;
}).catch(() => {
  $('#dot').className = 'dot down';
  $('#status').textContent = 'offline';
});
</script>
</body>
</html>
